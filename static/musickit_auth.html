<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vivaldi · autorizar Apple Music</title>
  <!-- URL correta do v3 (applemusickit.js retorna 404) -->
  <script src="https://js-cdn.music.apple.com/musickit/v3/musickit.js" async></script>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; font-family: system-ui, sans-serif;
      background: #0f0d0a; color: #ffffff; display: grid; place-items: center; padding: 24px;
    }
    .box {
      width: min(520px, 100%); border: 1px solid rgba(255,255,255,.14);
      border-radius: 14px; padding: 28px; background: #161412;
    }
    h1 { font-size: 1.4rem; margin: 0 0 8px; color: #ffffff; }
    p { color: #d6d0c8; line-height: 1.55; }
    code { color: #ffffff; word-break: break-all; }
    label {
      display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      color: #d6d0c8; margin: 16px 0 6px; font-weight: 600;
    }
    input, textarea {
      width: 100%; box-sizing: border-box; background: #0c0a08; color: #ffffff;
      border: 1px solid rgba(255,255,255,.18); border-radius: 8px; padding: 10px 12px;
      font: 13px ui-monospace, monospace;
    }
    button {
      margin-top: 16px; width: 100%; border: 0; border-radius: 4px; padding: 14px;
      background: #ff4700; color: #0f0d0a; font-weight: 800; letter-spacing: .04em;
      text-transform: uppercase; cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .ok { color: #9dffc8; font-size: 14px; margin-top: 10px; font-weight: 600; }
    .err { color: #ff8a8a; font-size: 14px; margin-top: 10px; font-weight: 600; white-space: pre-wrap; }
    .hint { color: #a39e96; font-size: 13px; margin-top: 10px; line-height: 1.45; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Autorizar Apple Music</h1>
    <p>Usa só a API oficial (MusicKit). Cole o developer token JWT e autorize sua conta. Depois copie o <strong>Music User Token</strong> para o arquivo <code>.env</code> do Vivaldi.</p>
    <p class="hint" id="proto">Carregando MusicKit…</p>
    <label>Developer token</label>
    <textarea id="dev" rows="4" placeholder="eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6Li4ufQ..."></textarea>
    <button id="go" disabled>Carregando MusicKit…</button>
    <label>Music User Token</label>
    <textarea id="user" rows="3" readonly placeholder="aparece após autorizar"></textarea>
    <div id="msg"></div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    const go = document.getElementById('go');
    const proto = document.getElementById('proto');

    function setErr(text) {
      msg.className = 'err';
      msg.textContent = text;
    }

    function ready() {
      go.disabled = false;
      go.textContent = 'Autorizar com Apple';
      msg.className = '';
      msg.textContent = '';
      proto.textContent = 'MusicKit pronto. Cole o developer token e autorize.';
    }

    function fail(detail) {
      go.disabled = true;
      go.textContent = 'MusicKit indisponível';
      setErr(
        'Não foi possível carregar o MusicKit JS.\n' +
        'Use Safari em http://127.0.0.1:7860/am-auth/musickit_auth.html\n' +
        String(detail || '')
      );
    }

    async function waitForMusicKit(timeoutMs) {
      if (window.MusicKit && typeof window.MusicKit.configure === 'function') {
        return window.MusicKit;
      }
      await new Promise((resolve, reject) => {
        const t = setTimeout(
          () => reject(new Error('MusicKit não carregou a tempo')),
          timeoutMs
        );
        document.addEventListener(
          'musickitloaded',
          () => { clearTimeout(t); resolve(); },
          { once: true }
        );
      });
      if (!window.MusicKit || typeof window.MusicKit.configure !== 'function') {
        throw new Error('MusicKit carregou sem configure()');
      }
      return window.MusicKit;
    }

    async function boot() {
      if (location.protocol === 'file:') {
        proto.textContent = 'Abra via http://127.0.0.1:7860/am-auth/musickit_auth.html no Safari.';
        fail('Página aberta como file:// — MusicKit bloqueado.');
        return;
      }
      proto.textContent = 'Origem OK. Aguardando CDN da Apple…';
      try {
        await waitForMusicKit(25000);
        ready();
      } catch (e) {
        fail(e && e.message ? e.message : e);
      }
    }

    go.onclick = async () => {
      msg.className = '';
      msg.textContent = 'Abrindo autorização…';
      const token = document.getElementById('dev').value.trim();
      if (!token) {
        setErr('Cole o developer token.');
        return;
      }
      try {
        const MusicKit = await waitForMusicKit(5000);
        const music = await MusicKit.configure({
          developerToken: token,
          app: { name: 'Vivaldi', build: '1.0.0' },
          suppressErrorDialog: false,
        });
        const userToken = await music.authorize();
        const finalToken = userToken || music.musicUserToken || '';
        document.getElementById('user').value = finalToken;
        if (!finalToken) {
          setErr('Autorizou, mas o user token veio vazio. Tente de novo no Safari.');
          return;
        }
        msg.className = 'ok';
        msg.textContent = 'Ok. Copie o Music User Token para APPLE_MUSIC_USER_TOKEN no .env';
      } catch (e) {
        setErr(String(e && e.message ? e.message : e));
      }
    };

    // Se o evento já disparou antes do listener
    if (window.MusicKit && typeof window.MusicKit.configure === 'function') {
      ready();
    } else {
      boot();
    }
  </script>
</body>
</html>
